  <rect width="512" height="512" rx="112" fill="#141414"/>
  <g fill="none" stroke="#ede6e6" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 148 240 L 148 352"/>
    <path d="M 148 240 C 148 180 256 180 256 240 L 256 352"/>
    <path d="M 256 240 C 256 180 364 180 364 240 L 364 352"/>
  </g>
</svg>
