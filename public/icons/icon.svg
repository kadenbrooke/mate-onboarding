<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mate neutral app icon (white-label). NO Auto Mate branding, NO client branding.
  Dark rounded square (#141414) with a light off-white (#ede6e6) lowercase "m".
  Per-client branding is applied at runtime via theming; this install icon is generic.
  Source of truth for the rasterized PNGs in this directory.
  Regenerate PNGs with: node scripts/gen-icons.mjs
-->
